<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movie Search</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <h1>Movie Search</h1>
  <div class="actions">
    <button id="tabSearch" class="tab active" type="button">Search</button>
    <button id="tabFav" class="tab" type="button">Favorites <span id="favCount">0</span></button>
    <button id="themeBtn" class="icon" type="button" aria-label="Toggle theme">Theme</button>
  </div>
</header>

<main>
  <section id="searchView">
    <form id="form" class="search">
      <input id="q" type="search" placeholder="Search a movie, series or episode" aria-label="Title" required>
      <select id="type" aria-label="Type">
        <option value="">All types</option>
        <option value="movie">Movies</option>
        <option value="series">Series</option>
        <option value="episode">Episodes</option>
      </select>
      <input id="year" type="number" min="1888" max="2100" placeholder="Year" aria-label="Year">
      <button type="submit">Search</button>
    </form>

    <div id="recent" class="chips" aria-label="Recent searches"></div>
    <div id="status" role="status"></div>
    <div id="results" class="grid"></div>
    <div class="more"><button id="moreBtn" type="button" hidden>Load more</button></div>
  </section>

  <section id="favView" hidden>
    <div id="favStatus" role="status"></div>
    <div id="favGrid" class="grid"></div>
  </section>
</main>

<dialog id="detail"></dialog>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
</body>
</html>
